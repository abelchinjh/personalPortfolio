<!doctype html><meta charset="utf-8"><title>Liquid Lens deterministic 3D renderer</title><style>html,body{margin:0;background:#dbece5}canvas{display:block;width:100vw;height:100vh}</style><canvas></canvas><script>
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
const vertex=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const fragment=`#version 300 es
precision highp float;
uniform vec2 resolution;uniform float phase;uniform float scene;uniform float portrait;out vec4 color;
mat2 rot(float a){return mat2(cos(a),-sin(a),sin(a),cos(a));}
float ell(vec3 p,vec3 r){float a=length(p/r),b=length(p/(r*r));return a*(a-1.)/max(b,.001);}
float blend(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
vec3 center(int i){float x=scene<.5?1.35:0.;if(i==0)return vec3(x+.04,-.45,0.);if(i==1)return vec3(x-.36,.63,-.08);return vec3(x+.65,.48,.12);}
vec3 local(vec3 p,int i){p-=center(i);p.y-=.025*sin(phase+float(i)*1.8);p.xz=rot(.22*sin(phase+float(i)))*p.xz;p.xy=rot((i==0?-.35:.25)+.035*sin(phase))*p.xy;return p;}
float object(vec3 p,int i){p=local(p,i);if(i==0){float a=ell(p,vec3(.66,.38,.42));float b=ell(p-vec3(-.25,.18,.02),vec3(.34,.30,.31));return blend(a,b,.25);}if(i==1){p.x+=.16*p.y;return blend(ell(p,vec3(.24,.42,.25)),ell(p-vec3(-.08,.25,0),vec3(.15,.24,.16)),.12);}return ell(p,vec3(.19,.17,.18));}
float map(vec3 p){return min(object(p,0),min(object(p,1),object(p,2)));}
vec3 normal(vec3 p){vec2 e=vec2(.001,0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}
vec3 backdrop(vec2 p){vec3 c=mix(vec3(.70,.84,.82),vec3(.94,.94,.88),smoothstep(-2.,2.,p.y));float peach=exp(-dot((p-vec2(1.7,1.0))*vec2(.6,.8),(p-vec2(1.7,1.0))*vec2(.6,.8)));c=mix(c,vec3(.97,.81,.72),peach*.5);float wave=sin(p.x*1.2+p.y*1.9)+.35*sin(p.x*3.-p.y*1.5);c+=.025*wave;float ribbon=exp(-pow((p.y+.85+.24*sin(p.x*1.5))/.16,2.));c+=ribbon*vec3(.10,.13,.10);return c;}
vec3 environment(vec3 d){vec3 c=backdrop(d.xy*3.);float stripe=pow(max(0.,1.-abs(d.x*.7+d.y*.6-.34)*4.),12.);c+=stripe*.8;float dark=pow(max(0.,dot(d,normalize(vec3(-1.,.15,.2)))),8.);float bar=exp(-pow((d.y+.20+d.x*.4)/.12,2.));return c*(1.-.78*dark)*(1.-.72*bar);}
void main(){vec2 uv=(gl_FragCoord.xy/resolution-.5)*vec2(resolution.x/resolution.y,1.)*mix(3.15,5.3,portrait);uv+=portrait*vec2(scene<.5?1.35:0.,scene<.5?.65:0.);vec3 ro=vec3(uv,4.),rd=vec3(0,0,-1);vec3 c=backdrop(uv);float t=0.;bool hit=false;for(int j=0;j<72;j++){float d=map(ro+rd*t);if(d<.0015){hit=true;break;}t+=max(d*.85,.002);if(t>5.2)break;}if(hit){vec3 p=ro+rd*t,n=normal(p);float f=.04+.96*pow(1.-max(0.,dot(n,-rd)),5.);vec3 enter=refract(rd,n,1./1.46);vec3 exitP=p+enter*.02;for(int k=0;k<40;k++){float depth=map(exitP);if(depth>-.001&&k>2)break;exitP+=enter*max(.003,abs(depth)*.8);}vec3 exitN=normal(exitP);vec3 rayOut=refract(enter,-exitN,1.46);if(length(rayOut)<.1)rayOut=reflect(enter,exitN);vec3 trans=backdrop(exitP.xy+rayOut.xy*2.);float band=sin((rayOut.x+rayOut.y*.6)*8.);trans=mix(trans,vec3(.11,.29,.29),.32*pow(max(0.,band),8.));trans=mix(trans,environment(reflect(enter,exitN)),.15);vec3 reflectC=environment(reflect(rd,n));vec3 tint=vec3(.89,.98,.96);trans*=tint;float caustic=pow(max(0.,sin(enter.x*10.+enter.y*7.)),12.);trans+=caustic*.16;float spec=pow(max(0.,dot(reflect(rd,n),normalize(vec3(-.7,1.,1.4)))),120.);c=mix(trans,reflectC,clamp(f+.17,0.,1.))+spec*.85;c*=1.-.48*pow(1.-abs(dot(n,rd)),5.);float rim=pow(1.-abs(dot(n,rd)),3.);c+=rim*.13*vec3(sin(n.x*12.+1.),sin(n.y*10.+2.),sin(n.x*9.+n.y*5.));c+=pow(1.-abs(dot(n,rd)),10.)*vec3(.12,.18,.17);}
color=vec4(clamp(c,0.,1.),1.);}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
window.draw=(frame=0,width=1280,height=720,which=0)=>{canvas.width=width;canvas.height=height;gl.viewport(0,0,width,height);gl.uniform2f(gl.getUniformLocation(program,'resolution'),width,height);gl.uniform1f(gl.getUniformLocation(program,'phase'),frame/144*Math.PI*2);gl.uniform1f(gl.getUniformLocation(program,'scene'),which);gl.uniform1f(gl.getUniformLocation(program,'portrait'),width<height?1:0);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();return canvas.toDataURL('image/png').split(',')[1];};draw();
</script>
