<!doctype html><meta charset="utf-8"><title>Controlled cobalt ribbon sculpture</title><style>html,body{margin:0;background:#101719}canvas{display:block;width:100vw;height:100vh}</style><canvas></canvas><script>
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true,antialias:true});
function shader(type,source){let s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
function program(v,f){let p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,v));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;}
const bg=program(`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p;gl_Position=vec4(p,.99,1.);}`,`#version 300 es
precision highp float;in vec2 uv;out vec4 c;void main(){float glow=exp(-dot(uv*vec2(.85,.65),uv*vec2(.85,.65))*1.9);vec3 a=mix(vec3(.026,.038,.048),vec3(.080,.107,.142),glow);a+=.009*uv.y;c=vec4(a,1.);}`);
const mesh=program(`#version 300 es
in vec3 position;in vec3 normal;uniform vec2 resolution;uniform float portrait;out vec3 N;out vec3 P;void main(){P=position;N=normal;float scale=mix(4.8,10.0,portrait);gl_Position=vec4(position.x/(scale*.5*(resolution.x/resolution.y)),position.y/(scale*.5),-position.z*.13,1.);}`,`#version 300 es
precision highp float;in vec3 N;in vec3 P;out vec4 c;void main(){vec3 n=normalize(N);if(n.z<0.)n=-n;vec3 view=vec3(0.,0.,1.);vec3 l=normalize(vec3(-1.5,2.0,2.7));float diff=max(0.,dot(n,l));float key=pow(max(0.,dot(n,normalize(l+view))),70.);float soft=pow(max(0.,dot(n,normalize(vec3(1.,.4,2.)))),9.);float rim=pow(1.-abs(dot(n,view)),3.);vec3 blue=vec3(.025,.12,.65);vec3 col=blue*(.38+diff*.90);col+=vec3(.18,.36,1.)*soft*.65;col+=vec3(.72,.84,1.)*key*.8;col+=vec3(.04,.18,.66)*rim*.40;float stripe=pow(max(0.,dot(reflect(-view,n),normalize(vec3(-.4,1.,.6)))),24.);col+=vec3(.13,.26,.65)*stripe*.35;c=vec4(pow(clamp(col,0.,1.),vec3(.80)),1.);}`);
const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const buffer=gl.createBuffer();
const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,s)=>a.map(v=>v*s),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>mul(a,1/(Math.hypot(...a)||1));
function point(t,u,r,phase){const sway=Math.sin(phase)*.045;const off=(r-1)*.46;const x=.85*Math.sin(t*1.16)+off,y=t*.67,z=.42*Math.cos(t*1.14)+(r-1)*.13;const twist=t*.94+r*.10+sway;const width=.29*(.92+.08*Math.cos(t));let p=[x+Math.cos(twist)*u*width,y+Math.sin(t*.6)*u*.045,z+Math.sin(twist)*u*width];const az=-.27+.018*Math.sin(phase),ay=.17+.055*Math.sin(phase);p=[p[0]*Math.cos(az)-p[1]*Math.sin(az),p[0]*Math.sin(az)+p[1]*Math.cos(az),p[2]];return[p[0]*Math.cos(ay)+p[2]*Math.sin(ay),p[1],-p[0]*Math.sin(ay)+p[2]*Math.cos(ay)];}
function surface(t,u,r,phase,side){const p=point(t,u,r,phase),dt=sub(point(t+.001,u,r,phase),point(t-.001,u,r,phase)),du=sub(point(t,u+.001,r,phase),point(t,u-.001,r,phase)),n=norm(cross(du,dt));return{p:add(p,mul(n,side*.012)),n:mul(n,side)};}
function geometry(phase){const data=[];function triangle(a,b,c,override){const n=override||null;for(const v of[a,b,c])data.push(...v.p,...(n||v.n));}function patch(a,b,c,d){triangle(a,b,c);triangle(c,b,d);}const count=180,wide=4;for(let r=0;r<3;r++){for(let side of[1,-1]){for(let i=0;i<count;i++){let t=-2.55+5.1*i/count,tn=-2.55+5.1*(i+1)/count;for(let j=0;j<wide;j++){let u=-1+2*j/wide,un=-1+2*(j+1)/wide;patch(surface(t,u,r,phase,side),surface(tn,u,r,phase,side),surface(t,un,r,phase,side),surface(tn,un,r,phase,side));}}}for(let edge of[-1,1])for(let i=0;i<count;i++){let t=-2.55+5.1*i/count,tn=-2.55+5.1*(i+1)/count;const a=surface(t,edge,r,phase,1),b=surface(tn,edge,r,phase,1),c=surface(t,edge,r,phase,-1),d=surface(tn,edge,r,phase,-1),n=norm(cross(sub(b.p,a.p),sub(c.p,a.p)));triangle(a,b,c,n);triangle(c,b,d,n);}}return new Float32Array(data);}
window.draw=(frame=0,width=1280,height=720)=>{canvas.width=width;canvas.height=height;gl.viewport(0,0,width,height);gl.disable(gl.DEPTH_TEST);gl.clearColor(.03,.04,.05,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(bg);gl.bindBuffer(gl.ARRAY_BUFFER,quad);let a=gl.getAttribLocation(bg,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);gl.disableVertexAttribArray(a);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.useProgram(mesh);let data=geometry(frame/144*Math.PI*2);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);for(const[name,offset]of[['position',0],['normal',12]]){let a=gl.getAttribLocation(mesh,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,24,offset);}gl.uniform2f(gl.getUniformLocation(mesh,'resolution'),width,height);gl.uniform1f(gl.getUniformLocation(mesh,'portrait'),width<height?1:0);gl.drawArrays(gl.TRIANGLES,0,data.length/6);gl.finish();return canvas.toDataURL('image/png').split(',')[1];};draw();
</script>
